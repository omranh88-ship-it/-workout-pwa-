<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>יומן אימון</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; margin: 0; background: #f6f6f6; color:#111; }
    header { background:#111; color:#fff; padding: 14px 16px; }
    header h1 { margin: 0; font-size: 18px; }
    main { padding: 14px 12px 90px; max-width: 980px; margin: 0 auto; }
    .card { background:#fff; border-radius: 12px; padding: 12px; margin: 10px 0; box-shadow: 0 1px 5px rgba(0,0,0,0.06); }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .row > * { flex: 1 1 180px; }
    label { display:block; font-size: 12px; color:#444; margin-bottom: 6px; }
    input, select, textarea, button {
      width: 100%; box-sizing: border-box;
      border: 1px solid #d6d6d6; border-radius: 10px;
      padding: 10px; font-size: 15px; background:#fff;
    }
    textarea { min-height: 72px; resize: vertical; }
    button { background:#111; color:#fff; border: none; cursor:pointer; }
    button.secondary { background:#e9e9e9; color:#111; border: 1px solid #d6d6d6; }
    button.danger { background:#b00020; }
    .muted { color:#666; font-size: 13px; }
    .exercise { border-top: 1px solid #eee; padding-top: 10px; margin-top: 10px; }
    .exercise h3 { margin: 0 0 8px; font-size: 16px; }
    .chip { display:inline-block; padding: 4px 8px; background:#f0f0f0; border-radius: 999px; font-size: 12px; margin-left: 6px; }
    a { color:#0b57d0; text-decoration: none; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background:#fff; border-top: 1px solid #ddd; }
    nav .wrap { max-width: 980px; margin: 0 auto; display:flex; gap:10px; padding: 10px 12px; }
  </style>
</head>
<body>
  <header>
    <h1>יומן אימון אישי</h1>
  </header>

  <main>
    <div class="card">
      <div class="row">
        <div>
          <label>תאריך</label>
          <input id="dateInput" type="date" />
        </div>
        <div>
          <label>יום בתכנית</label>
          <select id="daySelect"></select>
        </div>
        <div>
          <label>חיפוש תרגיל</label>
          <input id="searchInput" type="text" placeholder="הקלד שם תרגיל..." />
        </div>
      </div>
      <p class="muted" id="dayDesc"></p>
    </div>

    <div class="card" id="workoutArea"></div>

    <div class="card">
      <h2 style="margin:0 0 10px;">היסטוריה</h2>
      <div class="row">
        <div>
          <button class="secondary" id="exportBtn">ייצוא נתונים (JSON)</button>
        </div>
        <div>
          <button class="secondary" id="importBtn">ייבוא נתונים (JSON)</button>
        </div>
        <div>
          <button class="danger" id="clearBtn">מחיקת כל הנתונים</button>
        </div>
      </div>
      <p class="muted">הנתונים נשמרים על האייפון בלבד. אם מוחקים Safari/אתר, הנתונים עלולים להימחק.</p>
      <div id="historyArea"></div>
    </div>
  </main>

  <nav>
    <div class="wrap">
      <button id="saveBtn">שמור אימון</button>
      <button class="secondary" id="addHomeHintBtn">איך מוסיפים למסך הבית</button>
    </div>
  </nav>

  <script src="app.js"></script>
</body>
</html>
